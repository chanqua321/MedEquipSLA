 text-anchor="middle" font-size="22" font-weight="650" fill="#ffffff">Redis Streams</text><text x="2085" y="715" text-anchor="middle" font-size="18" font-weight="400" fill="#ffffff">RESP / consumer groups</text><text x="2085" y="744" text-anchor="middle" font-size="18" font-weight="400" fill="#ffffff">Persistence + volume</text><text x="2085" y="773" text-anchor="middle" font-size="18" font-weight="400" fill="#ffffff">Bounded retry / DLQ</text><rect x="1960" y="1405" width="280" height="115" rx="12" fill="#6b7c8e"/><text x="2100" y="1441" text-anchor="middle" font-size="22" font-weight="650" fill="#ffffff">Email System</text><text x="2100" y="1470" text-anchor="middle" font-size="18" font-weight="400" fill="#ffffff">External SMTP</text><text x="355" y="1340" text-anchor="start" font-size="21" font-weight="600" fill="#23734f">DATA: 5 separate databases, DbContexts, migration histories and runtime users.</text><text x="355" y="1377" text-anchor="start" font-size="19" font-weight="400" fill="#567085">DEV: Docker Compose for the team. SQL Server 2022 Developer / five owned databases.</text><text x="355" y="1414" text-anchor="start" font-size="19" font-weight="400" fill="#567085">gRPC: Maintenance / Incident -> Equipment. Events use RESP; SQL uses TDS.</text><text x="355" y="1451" text-anchor="start" font-size="19" font-weight="400" fill="#567085">SignalR runs through Gateway. Internal user / department gRPC lookups are detailed in Mermaid.</text><text x="355" y="1488" text-anchor="start" font-size="19" font-weight="400" fill="#567085">No cross-database joins or foreign keys. CQRS read/write share only their service-owned database.</text><text x="355" y="1540" text-anchor="start" font-size="18" font-weight="400" fill="#567085">Overview only - see C1-Container.md and the PRN232 checklist for implementation status.</text></svg>