<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1290"><style>text{font-family:Segoe UI,Arial,sans-serif}</style><rect width="100%" height="100%" fill="#f5f8fc"/><text x="70" y="65" font-size="36" fill="#17324d" font-weight="700">MedEquipSLA | Database ERD review</text><text x="70" y="105" font-size="21" fill="#526981" font-weight="400">SQL Server Code First • 5 owned databases • Approved v0.1 • Code First schema created</text><text x="70" y="142" font-size="17" fill="#526981" font-weight="400">Solid relationship lines in detailed ERDs = local FK. REF fields = logical IDs across services, never cross-database FK.</text><rect x="70" y="190" width="800" height="280" rx="16" fill="#fff" stroke="#d3deea"/><rect x="70" y="190" width="800" height="56" rx="16" fill="#315aa1"/><text x="94" y="227" font-size="24" fill="#fff" font-weight="650">MedEquip_Identity</text><text x="94" y="282" font-size="19" fill="#20364e" font-weight="400">Users 1 — N UserRoles N — 1 Roles</text><text x="94" y="316" font-size="19" fill="#20364e" font-weight="400">Users 1 — N RefreshTokens</text><text x="94" y="350" font-size="19" fill="#20364e" font-weight="400">Identity claims / logins / token store</text><text x="94" y="384" font-size="19" fill="#20364e" font-weight="400">AuthorizationVersion + DepartmentId (REF)</text><text x="94" y="440" font-size="17" fill="#61758c" font-weight="400">8 business / Identity tables + 2 owned technical tables</text><rect x="930" y="190" width="800" height="280" rx="16" fill="#fff" stroke="#d3deea"/><rect x="930" y="190" width="800" height="56" rx="16" fill="#1f7b68"/><text x="954" y="227" font-size="24" fill="#fff" font-weight="650">MedEquip_Equipment</text><text x="954" y="282" font-size="19" fill="#20364e" font-weight="400">Departments 1 — N EquipmentAssets</text><text x="954" y="316" font-size="19" fill="#20364e" font-weight="400">Categories 1 — N EquipmentAssets</text><text x="954" y="350" font-size="19" fill="#20364e" font-weight="400">Equipment 1 — N StateProjections / UseRegistrations</text><text x="954" y="384" font-size="19" fill="#20364e" font-weight="400">Status history + reconciliation checkpoint</text><text x="954" y="440" font-size="17" fill="#61758c" font-weight="400">7 business / Identity tables + 4 owned technical tables</text><rect x="70" y="510" width="800" height="280" rx="16" fill="#fff" stroke="#d3deea"/><rect x="70" y="510" width="800" height="56" rx="16" fill="#98551b"/><text x="94" y="547" font-size="24" fill="#fff" font-weight="650">MedEquip_Maintenance</text><text x="94" y="602" font-size="19" fill="#20364e" font-weight="400">Schedule 1 — N Occurrences</text><text x="94" y="636" font-size="19" fill="#20364e" font-weight="400">Occurrence 0..1 — 0..1 WorkOrder</text><text x="94" y="670" font-size="19" fill="#20364e" font-weight="400">WorkOrder 1 — N Attempts 1 — N Measurements</text><text x="94" y="704" font-size="19" fill="#20364e" font-weight="400">Occurrence reminders + work activity history</text><text x="94" y="760" font-size="17" fill="#61758c" font-weight="400">7 business / Identity tables + 3 owned technical tables</text><rect x="930" y="510" width="800" height="280" rx="16" fill="#fff" stroke="#d3deea"/><rect x="930" y="510" width="800" height="56" rx="16" fill="#774b9c"/><text x="954" y="547" font-size="24" fill="#fff" font-weight="650">MedEquip_Incident</text><text x="954" y="602" font-size="19" fill="#20364e" font-weight="400">Policy 1 — N PolicyVersions 1 — N Incidents</text><text x="954" y="636" font-size="19" fill="#20364e" font-weight="400">Incident 1 — N ResolutionAttempts</text><text x="954" y="670" font-size="19" fill="#20364e" font-weight="400">Incident 1 — N Activities / SLA deadline alerts</text><text x="954" y="704" font-size="19" fill="#20364e" font-weight="400">Immutable SLA snapshot + final outcome</text><text x="954" y="760" font-size="17" fill="#61758c" font-weight="400">6 business / Identity tables + 3 owned technical tables</text><rect x="70" y="830" width="800" height="280" rx="16" fill="#fff" stroke="#d3deea"/><rect x="70" y="830" width="800" height="56" rx="16" fill="#a03d62"/><text x="94" y="867" font-size="24" fill="#fff" font-weight="650">MedEquip_Notification</text><text x="94" y="922" font-size="19" fill="#20364e" font-weight="400">Notification 1 — 0..1 EmailDelivery</text><text x="94" y="956" font-size="19" fill="#20364e" font-weight="400">EmailDelivery 1 — N DeliveryAttempts</text><text x="94" y="990" font-size="19" fill="#20364e" font-weight="400">Preferences by UserId (REF) + notification kind</text><text x="94" y="1024" font-size="19" fill="#20364e" font-weight="400">Recipient scope + durable notification storage</text><text x="94" y="1080" font-size="17" fill="#61758c" font-weight="400">4 business / Identity tables + 3 owned technical tables</text><rect x="930" y="830" width="800" height="280" rx="16" fill="#fff4d8" stroke="#e8cc83"/><text x="954" y="873" font-size="24" fill="#84530c" font-weight="700">Approved decisions D1–D4</text><text x="954" y="920" font-size="18" fill="#704d19" font-weight="400">D1  SLA: time of the final accepted resolution attempt</text><text x="954" y="955" font-size="18" fill="#704d19" font-weight="400">D2  Remind by occurrence before WorkOrder creation</text><text x="954" y="990" font-size="18" fill="#704d19" font-weight="400">D3  Durable use registration + reconciliation</text><text x="954" y="1025" font-size="18" fill="#704d19" font-weight="400">D4  Failed calibration keeps equipment blocked</text><text x="954" y="1060" font-size="18" fill="#704d19" font-weight="400">Entities / migrations / databases created; workflow code pending</text><text x="70" y="1180" font-size="22" fill="#17324d" font-weight="650">32 business / Identity tables + 15 service-owned technical tables = 47 application tables approved.</text><text x="70" y="1220" font-size="18" fill="#526981" font-weight="400">Full keys, nullability and constraints: ERD-REVIEW.md + services/*.md. EF migrations history is excluded from this count.</text></svg>