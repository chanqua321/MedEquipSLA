# Isolated disposable infrastructure for integration tests, never the application volumes.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_TEST_PASSWORD:?Provide an isolated test password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:14333:1433"]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes: [sql-test-data:/var/opt/mssql]
  redis:
    image: redis:8.2.10-alpine
    ports: ["127.0.0.1:16380:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sql-test-data:
