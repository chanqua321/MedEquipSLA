name: scaffold-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/Test-Documentation.py
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore MedEquipSLA.sln --locked-mode
      - run: dotnet build MedEquipSLA.sln -c Release --no-restore
      - run: dotnet test MedEquipSLA.sln -c Release --no-build --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/Web/.node-version
          cache: npm
          cache-dependency-path: src/Web/package-lock.json
      - run: npm ci && npm run build
        working-directory: src/Web
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start isolated SQL Server 2022
        shell: bash
        run: |
          SQL_TEST_PASSWORD="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$SQL_TEST_PASSWORD"
          echo "SQLSERVER_TEST_CONNECTION=Server=127.0.0.1,14333;Database=master;User Id=sa;Password=$SQL_TEST_PASSWORD;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run --detach --name medequip-sql-tests \
            --publish 127.0.0.1:14333:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer \
            --env MSSQL_SA_PASSWORD="$SQL_TEST_PASSWORD" \
            --env SQLCMDPASSWORD="$SQL_TEST_PASSWORD" \
            --health-cmd='/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1" -o /dev/null' \
            --health-interval=2s --health-timeout=5s --health-retries=60 \
            mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
          for attempt in $(seq 1 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' medequip-sql-tests)" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs medequip-sql-tests
          exit 1
      - run: dotnet restore tests/MedEquipSLA.Database.IntegrationTests --locked-mode
      - run: dotnet test tests/MedEquipSLA.Database.IntegrationTests -c Release --no-restore --logger trx --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlserver-database-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
      - name: Remove test container
        if: always()
        run: docker rm --force medequip-sql-tests || true
